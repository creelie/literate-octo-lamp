name: release

# Run by hand from the Actions tab (or the API) after the PR is merged. It builds the Lean
# formalization (with the Mathlib cache), checks its axioms, runs the C, C++, Bash, Python and
# Julia checks, then publishes a GitHub release with the paper files in dist/ and the notes in
# .github/RELEASE_NOTES.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.0.0"
        required: true
        default: "v2.1.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"
      title:
        description: "Release title"
        required: true
        default: "The minimum number of distinct abelian squares in a binary circular word"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean build, axiom check and the C, C++, Bash, Python and Julia checks
        run: scripts/run_all.sh

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the paper files
        run: |
          for f in dist/SimpsonCircularAbelianSquares_final2.pdf \
                   dist/SimpsonCircularAbelianSquares_final2-tex.zip \
                   dist/SimpsonCircularAbelianSquares_final2-arxiv.tar.gz \
                   preprintSimpsonCircularAbelianSquares/SimpsonCircularAbelianSquares.pdf \
                   MasterSimpsonCircularAbelianSquares_masterzipfinal2.zip; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" dist/SimpsonCircularAbelianSquares_final2* \
            --target "$TARGET" \
            --title "$TAG: $TITLE" \
            --notes-file .github/RELEASE_NOTES.md
